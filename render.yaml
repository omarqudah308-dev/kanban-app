# Render Blueprint for kanban-app
# https://render.com/docs/blueprints

services:
  - type: web
    name: kanban-app
    env: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Set these in the Render dashboard:
      # - STRIPE_SECRET_KEY
      # - STRIPE_PUBLISHABLE_KEY